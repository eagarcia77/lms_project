name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/apply_v3.py
      - run: python tools/apply_course_studio_package.py
      - run: pip install -r requirements.txt pytest
      - run: test -f tools/apply_course_studio.py
      - run: python tools/apply_course_studio.py
      - run: test -f app/course_builder.py && test -f app/runtime_entry.py
      - run: python tools/fix_course_builder_response_types.py
      - run: python -m compileall -q app
      - run: PYTHONPATH=. pytest -q
      - run: node --check app/static/app.js && node --check app/static/auth.js
      - run: >-
          PYTHONPATH=. python -c "from app.runtime_entry import app;
          routes=[(getattr(r,'path',''),set(getattr(r,'methods',[]) or [])) for r in app.routes];
          assert any(p == '/course-studio' and 'GET' in m for p,m in routes);
          assert any(p == '/course-studio/courses' and 'POST' in m for p,m in routes);
          assert any(p == '/course-studio/courses/{course_id}/modules' and 'POST' in m for p,m in routes);
          assert any(p == '/course-studio/modules/{module_id}/activities' and 'POST' in m for p,m in routes)"
