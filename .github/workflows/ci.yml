name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_NAME: NUVEDRA
      SESSION_SECRET: build-verification-session-secret-change-in-production
      NEXUS_SESSION_SECRET: build-verification-admin-secret-change-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve unified overlay and apply authenticated base
        run: |
          mkdir -p /tmp/nexus-overlay/app /tmp/nexus-overlay/static
          cp app/unified_authoring.py app/innovation_hub.py app/course_workspace.py app/academic_portal.py app/academic_access.py app/faculty_portal.py app/student_portal.py app/google_hub_safe.py app/platform_upgrade.py app/admin_portal.py app/role_management.py app/production_entry.py app/home_content.py app/patch_public_homepage_runtime.py app/admin_authoring_v6.py app/admin_console.py app/admin_system.py /tmp/nexus-overlay/app/
          cp -a app/static/. /tmp/nexus-overlay/static/
          cp start_runtime.sh requirements.txt /tmp/nexus-overlay/
          python tools/apply_v3.py
          cp /tmp/nexus-overlay/app/* app/
          mkdir -p app/static
          cp -a /tmp/nexus-overlay/static/. app/static/
          cp /tmp/nexus-overlay/start_runtime.sh /tmp/nexus-overlay/requirements.txt ./
      - run: pip install -r requirements.txt pytest
      - run: python tools/patch_google_workspace_scopes.py
      - run: python tools/patch_admin_navigation.py
      - run: python tools/patch_admin_portal_roles.py
      - run: python tools/disable_pwa_cache.py
      - run: python tools/fix_unified_authoring_templates.py
      - run: python tools/patch_nuvedra_branding.py
      - run: python app/patch_public_homepage_runtime.py
      - run: test -f app/unified_authoring.py && test -f app/innovation_hub.py && test -f app/course_workspace.py && test -f app/academic_portal.py && test -f app/academic_access.py && test -f app/faculty_portal.py && test -f app/student_portal.py && test -f app/google_hub_safe.py && test -f app/google_api.py && test -f app/platform_upgrade.py && test -f app/admin_portal.py && test -f app/role_management.py && test -f app/production_entry.py && test -f app/home_content.py && test -f app/patch_public_homepage_runtime.py && test -f app/admin_authoring_v6.py && test -f app/admin_console.py && test -f app/admin_system.py && test -f app/static/auth.js && test -f app/static/i18n.js && test -f tools/patch_admin_portal_roles.py && test -f tools/disable_pwa_cache.py && test -f tools/fix_unified_authoring_templates.py && test -f tools/patch_nuvedra_branding.py && test -f tools/validate_runtime_dependencies.py && test -f tools/validate_unified_routes.py && test -f tools/smoke_test_admin_flow.py && test -f tools/smoke_test_integrated_portal.py && test -f tools/smoke_test_role_management.py && test -f tools/smoke_test_nuvedra_branding.py && test -f tools/smoke_test_course_workspace.py && test -f tools/smoke_test_academic_roles.py && test -f tools/smoke_test_platform_upgrade.py
      - run: python -m py_compile app/*.py tools/patch_google_workspace_scopes.py tools/patch_admin_navigation.py tools/patch_admin_portal_roles.py tools/disable_pwa_cache.py tools/fix_unified_authoring_templates.py tools/patch_nuvedra_branding.py tools/validate_runtime_dependencies.py tools/validate_unified_routes.py tools/smoke_test_admin_flow.py tools/smoke_test_integrated_portal.py tools/smoke_test_role_management.py tools/smoke_test_nuvedra_branding.py tools/smoke_test_course_workspace.py tools/smoke_test_academic_roles.py tools/smoke_test_platform_upgrade.py
      - run: python tools/validate_runtime_dependencies.py
      - run: PYTHONPATH=. python tools/validate_unified_routes.py
      - run: PYTHONPATH=. python tools/smoke_test_admin_flow.py
      - run: PYTHONPATH=. python tools/smoke_test_integrated_portal.py
      - run: PYTHONPATH=. python tools/smoke_test_role_management.py
      - run: PYTHONPATH=. python tools/smoke_test_nuvedra_branding.py
      - run: PYTHONPATH=. python tools/smoke_test_course_workspace.py
      - run: PYTHONPATH=. python tools/smoke_test_academic_roles.py
      - run: PYTHONPATH=. python tools/smoke_test_platform_upgrade.py
      - run: PYTHONPATH=. pytest -q
      - run: node --check app/static/app.js && node --check app/static/auth.js && node --check app/static/sw.js && node --check app/static/i18n.js
      - run: grep -q "store_token" app/google_api.py && grep -q "https://www.googleapis.com/auth/drive.file" app/google_api.py && grep -q "https://www.googleapis.com/auth/forms.body" app/google_api.py
      - run: grep -q "Administración integral" app/admin_portal.py && grep -q '"/admin/roles"' app/admin_portal.py && grep -q '"/admin/home-content"' app/admin_portal.py && grep -q "Debe permanecer por lo menos un superadministrador activo" app/role_management.py
      - run: grep -q "NUVEDRA Course Workspace" app/course_workspace.py && grep -q "google-hub" app/course_workspace.py && grep -q "Tecnologías emergentes" app/course_workspace.py
      - run: grep -q "course_created_and_professor_assigned" app/academic_access.py && grep -q "Google Hub sencillo" app/google_hub_safe.py && grep -q "/api/google/drive/files" app/google_hub_safe.py && ! grep -q "from app import google_api" app/google_hub_safe.py && grep -q "register_platform_upgrade" app/production_entry.py && grep -q 'DEFAULT_LANGUAGE = "en"' app/static/i18n.js && grep -q '"Español"' app/static/i18n.js && grep -q "student_assessment_submitted" app/student_portal.py
      - run: grep -q "NUVEDRA" app/static/index.html && grep -q "NUVEDRA_PUBLIC_LOGIN_SAFE_V1" app/static/app.js && grep -q "NUVEDRA_ACCESSIBLE_THEME_V1" app/static/styles.css && grep -q '"name": "NUVEDRA"' app/static/manifest.json && grep -q "prefers-reduced-motion" app/static/styles.css && grep -q "forced-colors" app/static/styles.css && ! grep -q "NEXUS EDU XR" app/static/index.html && ! grep -qi "#007B5F\|#FED141\|#85714D" app/static/styles.css
      - run: grep -q "NEXUS_PWA_DISABLED_FOR_STABILITY" app/static/app.js && grep -q "self.registration.unregister()" app/static/sw.js && ! grep -q 'register("/static/sw.js")' app/static/app.js
