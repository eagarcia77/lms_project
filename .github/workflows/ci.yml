name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: build-verification-session-secret-change-in-production
      NEXUS_SESSION_SECRET: build-verification-admin-secret-change-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve unified overlay and apply authenticated base
        run: |
          mkdir -p /tmp/nexus-overlay/app
          cp app/unified_authoring.py app/production_entry.py app/admin_authoring_v6.py app/admin_console.py app/admin_system.py /tmp/nexus-overlay/app/
          cp start_runtime.sh requirements.txt /tmp/nexus-overlay/
          python tools/apply_v3.py
          cp /tmp/nexus-overlay/app/* app/
          cp /tmp/nexus-overlay/start_runtime.sh /tmp/nexus-overlay/requirements.txt ./
      - run: pip install -r requirements.txt pytest
      - run: python tools/patch_google_workspace_scopes.py
      - run: python tools/patch_admin_navigation.py
      - run: test -f app/unified_authoring.py && test -f app/production_entry.py && test -f app/admin_authoring_v6.py && test -f app/admin_console.py && test -f app/admin_system.py && test -f tools/validate_runtime_dependencies.py && test -f tools/validate_unified_routes.py && test -f tools/smoke_test_admin_flow.py
      - run: python -m py_compile app/*.py tools/patch_google_workspace_scopes.py tools/patch_admin_navigation.py tools/validate_runtime_dependencies.py tools/validate_unified_routes.py tools/smoke_test_admin_flow.py
      - run: python tools/validate_runtime_dependencies.py
      - run: PYTHONPATH=. python tools/validate_unified_routes.py
      - run: PYTHONPATH=. python tools/smoke_test_admin_flow.py
      - run: PYTHONPATH=. pytest -q
      - run: node --check app/static/app.js && node --check app/static/auth.js
      - run: grep -q "https://www.googleapis.com/auth/drive.file" app/google_api.py && grep -q "https://www.googleapis.com/auth/forms.body" app/google_api.py
      - run: grep -q 'href="/admin/authoring"' app/admin_console.py && grep -q 'href="/admin/system"' app/admin_console.py
