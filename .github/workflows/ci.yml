name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/apply_v3.py
      - run: python tools/apply_course_studio_package.py
      - run: pip install -r requirements.txt pytest
      - run: test -f tools/apply_course_studio.py
      - run: python tools/apply_course_studio.py
      - run: python tools/install_course_builder.py
      - run: python tools/fix_course_builder_response_types.py
      - run: python -m compileall -q app
      - run: PYTHONPATH=. pytest -q
      - run: node --check app/static/app.js && node --check app/static/auth.js
      - run: PYTHONPATH=. python -c "from app.main import app; routes={(getattr(r,'path',''),','.join(sorted(getattr(r,'methods',[]) or []))) for r in app.routes}; assert any(path == '/course-studio' for path,_ in routes); assert any(path == '/course-studio/courses' and 'POST' in methods for path,methods in routes)"
