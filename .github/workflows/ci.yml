name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/apply_v3.py
      - run: python tools/apply_course_studio_package.py
      - run: python tools/apply_course_studio.py
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: PYTHONPATH=. pytest -q
      - run: node --check app/static/app.js && node --check app/static/auth.js
      - run: PYTHONPATH=. python -c "from app.course_studio_entry import app; assert any(getattr(r, 'path', '') == '/course-studio' for r in app.routes)"
