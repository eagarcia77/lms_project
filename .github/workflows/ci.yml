name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: build-verification-session-secret-change-in-production
      NEXUS_SESSION_SECRET: build-verification-admin-secret-change-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve unified overlay and apply authenticated base
        run: |
          mkdir -p /tmp/nexus-overlay/app
          cp app/unified_authoring.py app/innovation_hub.py app/admin_portal.py app/role_management.py app/home_admin_access.py app/platform_access.py app/course_management.py app/unified_course_catalog.py app/production_entry.py app/admin_authoring_v6.py app/admin_console.py app/admin_system.py /tmp/nexus-overlay/app/
          cp start_runtime.sh requirements.txt /tmp/nexus-overlay/
          python tools/apply_v3.py
          cp /tmp/nexus-overlay/app/* app/
          cp /tmp/nexus-overlay/start_runtime.sh /tmp/nexus-overlay/requirements.txt ./
      - run: pip install -r requirements.txt pytest
      - run: python tools/patch_google_workspace_scopes.py
      - run: python tools/patch_admin_navigation.py
      - run: python tools/patch_admin_portal_roles.py
      - run: python tools/patch_academic_roles.py
      - run: python tools/patch_home_admin_button.py
      - run: python tools/patch_course_catalog_frontend.py
      - run: python tools/bump_course_editor_cache.py
      - run: python tools/fix_unified_authoring_templates.py
      - run: test -f app/course_management.py && test -f app/unified_course_catalog.py && test -f app/production_entry.py && test -f tools/patch_course_catalog_frontend.py && test -f tools/bump_course_editor_cache.py && test -f tools/smoke_test_course_editing.py
      - run: python -m py_compile app/*.py tools/*.py
      - run: python tools/validate_runtime_dependencies.py
      - run: PYTHONPATH=. python tools/validate_unified_routes.py
      - run: PYTHONPATH=. python tools/smoke_test_admin_flow.py
      - run: PYTHONPATH=. python tools/smoke_test_integrated_portal.py
      - run: PYTHONPATH=. python tools/smoke_test_role_management.py
      - run: PYTHONPATH=. python tools/smoke_test_academic_roles.py
      - run: PYTHONPATH=. python tools/smoke_test_home_admin_button.py
      - run: PYTHONPATH=. python tools/smoke_test_course_editing.py
      - run: PYTHONPATH=. pytest -q
      - run: node --check app/static/app.js && node --check app/static/auth.js && node --check app/static/sw.js
      - run: grep -q 'NEXUS_UNIFIED_COURSE_CATALOG_FRONTEND' app/static/app.js && grep -q '20260724-course-edit-v5' app/static/index.html && grep -q '20260724-course-edit-v5' app/static/sw.js && grep -q '/admin/authoring/courses/{course_id}/update' app/production_entry.py && grep -q 'Creación y edición unificada' app/course_management.py && grep -q 'Portada y Course Studio conectados' app/unified_course_catalog.py
