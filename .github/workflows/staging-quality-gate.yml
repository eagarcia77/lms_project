name: Staging Quality Gate

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-quality-gate:
    name: Build, tests and runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the exact Render Docker image
        run: docker build --tag nexus-edu-xr-staging-ci:${{ github.sha }} .

      - name: Start isolated staging container
        run: |
          docker run --detach \
            --name nexus-staging-ci \
            --publish 8000:8000 \
            --env PORT=8000 \
            --env APP_NAME='EAGR Learning XR · STAGING' \
            --env APP_ENV=staging \
            --env RELEASE_CHANNEL=staging \
            --env COOKIE_SECURE=false \
            --env DATABASE_URL=sqlite:////tmp/nexus-staging-runtime.db \
            --env SESSION_SECRET=staging-runtime-session-secret-at-least-thirty-two-characters \
            --env NEXUS_SESSION_SECRET=staging-runtime-admin-secret-at-least-thirty-two-characters \
            --env NEXUS_BOOTSTRAP_ADMIN_EMAIL=staging.ci@example.com \
            --env NEXUS_BOOTSTRAP_ADMIN_PASSWORD=Staging-CI-Password-2026! \
            --env NEXUS_BOOTSTRAP_ADMIN_NAME='Administrador EAGR Learning XR de pruebas' \
            nexus-edu-xr-staging-ci:${{ github.sha }}

      - name: Wait for application health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs nexus-staging-ci
          exit 1

      - name: Validate EAGR Learning XR runtime
        run: |
          curl --fail --silent http://127.0.0.1:8000/healthz
          curl --fail --silent http://127.0.0.1:8000/api/release > /tmp/release.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/release.json', encoding='utf-8'))
          assert payload['application'] == 'EAGR Learning XR · STAGING', payload
          assert payload['isStaging'] is True, payload
          assert payload['isProduction'] is False, payload
          PY

          home_status="$(curl --silent --show-error --output /tmp/home-response.html --dump-header /tmp/home-headers.txt --write-out '%{http_code}' http://127.0.0.1:8000/)"
          case "$home_status" in
            200)
              ;;
            302|303|307|308)
              home_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/home-headers.txt)"
              case "$home_location" in
                /*)
                  if [ "$home_location" = "/" ]; then
                    echo "La portada redirige hacia sí misma."
                    exit 1
                  fi
                  ;;
                *)
                  echo "La portada produjo una redirección externa o vacía: $home_location"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "La portada respondió con un estado inesperado: $home_status"
              cat /tmp/home-response.html
              exit 1
              ;;
          esac

          curl --fail --silent --output /tmp/static-home.html http://127.0.0.1:8000/static/index.html
          curl --fail --silent --output /tmp/admin-login.html http://127.0.0.1:8000/admin/login
          grep -q 'EAGR Learning XR' /tmp/static-home.html
          grep -q 'EAGR Learning XR' /tmp/admin-login.html
          ! grep -q 'NEXUS EDU XR' /tmp/static-home.html
          ! grep -q 'NEXUS EDU XR' /tmp/admin-login.html

      - name: Show logs on failure
        if: failure()
        run: docker logs nexus-staging-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force nexus-staging-ci || true
