services:
  - type: web
    name: nexus-edu-xr-eagarcia77
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: NEXUS EDU XR
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        value: https://nexus-edu-xr-eagarcia77.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXUS_SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-edu-xr-db
          property: connectionString
      - key: NEXUS_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: NEXUS_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: NEXUS_BOOTSTRAP_ADMIN_NAME
        value: Administrador NEXUS
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://nexus-edu-xr-eagarcia77.onrender.com/auth/google/callback
      - key: GOOGLE_WORKSPACE_DOMAIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: NEXUS EDU XR
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"

databases:
  - name: nexus-edu-xr-db
    plan: free
    region: virginia
